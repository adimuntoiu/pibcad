<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Demo Paintings Target Sheet</title>
		<style>
			body {
				margin: 0;
				padding: 20px;
				font-family: system-ui, -apple-system, sans-serif;
				background: #09090b;
				color: #fafafa;
				display: flex;
				flex-direction: column;
				align-items: center;
			}
			.pair-stage {
				display: flex;
				gap: 24px;
				flex-wrap: wrap;
				justify-content: center;
				padding: 28px;
				background: #ffffff;
				border-radius: 20px;
				max-width: 820px;
			}
			.canvas-card {
				display: flex;
				flex-direction: column;
				align-items: center;
				color: #18181b;
			}
			.fiducial-frame {
				width: min(75vw, 340px);
				height: min(75vw, 340px);
				border: 10px solid #09090b;
				box-sizing: border-box;
				cursor: pointer;
				background: #000;
			}
			.fiducial-frame img {
				width: 100%;
				height: 100%;
				display: block;
				object-fit: cover;
			}
			.meta {
				margin-top: 10px;
				font-size: 0.85rem;
				font-weight: 700;
			}
		</style>
	</head>
	<body>
		<div class="pair-stage">
			<div class="canvas-card">
				<div id="canvasA" class="fiducial-frame" onclick="rotA = (rotA + 90) % 360; this.style.transform = `rotate(${rotA}deg)`">
					<img src="/demo-targets/painting-a.svg" alt="Painting A" />
				</div>
				<div class="meta">Equinox I — Solar Ember (Tap to rotate)</div>
			</div>
			<div class="canvas-card">
				<div id="canvasB" class="fiducial-frame" onclick="rotB = (rotB + 90) % 360; this.style.transform = `rotate(${rotB}deg)`">
					<img src="/demo-targets/painting-b.svg" alt="Painting B" />
				</div>
				<div class="meta">Equinox II — Astral Tide (Tap to rotate)</div>
			</div>
			<div class="canvas-card">
				<div id="canvasC" class="fiducial-frame" onclick="rotC = (rotC + 90) % 360; this.style.transform = `rotate(${rotC}deg)`">
					<img src="/demo-targets/painting-c.jpg" alt="Painting C" />
				</div>
				<div class="meta">Monolith I — Stone Guardian (Tap to rotate)</div>
			</div>
			<div class="canvas-card">
				<div id="canvasD" class="fiducial-frame" onclick="rotD = (rotD + 90) % 360; this.style.transform = `rotate(${rotD}deg)`">
					<img src="/demo-targets/painting-d.jpg" alt="Painting D" />
				</div>
				<div class="meta">Monolith II — Inverted Horizon (Tap to rotate)</div>
			</div>
		</div>
		<script>
			let rotA = 0;
			let rotB = 0;
			let rotC = 0;
			let rotD = 0;
		</script>
	</body>
</html>
