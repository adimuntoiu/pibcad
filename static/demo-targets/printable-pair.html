<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>IRLO Printable AR Pair — Edges A / B / C / D</title>
		<style>
			body {
				margin: 0;
				padding: 18px;
				font-family: system-ui, -apple-system, sans-serif;
				background: #09090b;
				color: #fafafa;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 14px;
			}
			.toolbar {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				justify-content: center;
				gap: 8px;
				max-width: 900px;
				padding: 12px 16px;
				background: #18181b;
				border: 1px solid rgba(255, 255, 255, 0.14);
				border-radius: 16px;
				font-size: 0.82rem;
			}
			.toolbar button {
				background: #27272a;
				color: #f4f4f5;
				border: 1px solid rgba(255, 255, 255, 0.15);
				border-radius: 10px;
				padding: 6px 11px;
				font-weight: 700;
				cursor: pointer;
			}
			.toolbar button:hover {
				background: #3f3f46;
			}
			.toolbar button.valid {
				border-color: rgba(52, 211, 153, 0.45);
				color: #6ee7b7;
			}
			.gap-ctrl {
				display: flex;
				align-items: center;
				gap: 8px;
				padding-left: 8px;
				color: #d4d4d8;
			}
			.status-pill {
				padding: 6px 14px;
				border-radius: 999px;
				font-family: ui-monospace, monospace;
				font-size: 0.82rem;
				font-weight: 700;
				border: 1px solid rgba(255, 255, 255, 0.16);
				background: #18181b;
			}
			.status-pill.ok {
				border-color: rgba(52, 211, 153, 0.5);
				color: #6ee7b7;
				background: rgba(6, 78, 59, 0.55);
			}
			.status-pill.bad {
				border-color: rgba(251, 113, 133, 0.45);
				color: #fecdd3;
				background: rgba(76, 5, 25, 0.5);
			}
			.pair-stage {
				display: flex;
				gap: 20px;
				flex-wrap: nowrap;
				justify-content: center;
				align-items: center;
				padding: 26px;
				background: #ffffff;
				border-radius: 20px;
				max-width: 920px;
			}
			.canvas-card {
				display: flex;
				flex-direction: column;
				align-items: center;
				color: #18181b;
			}
			.frame-wrap {
				position: relative;
				width: min(40vw, 310px);
				height: min(40vw, 310px);
			}
			.fiducial-frame {
				width: 100%;
				height: 100%;
				border: 6px solid #09090b;
				box-sizing: border-box;
				cursor: pointer;
				background: #000;
				transition: transform 0.22s ease;
			}
			.fiducial-frame img {
				width: 100%;
				height: 100%;
				display: block;
				object-fit: cover;
			}
			.edge-lbl {
				position: absolute;
				width: 22px;
				height: 22px;
				border-radius: 999px;
				background: rgba(9, 9, 11, 0.9);
				color: #fafafa;
				border: 1.5px solid #e4e4e7;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 0.72rem;
				font-weight: 800;
				pointer-events: none;
				z-index: 2;
			}
			.edge-top {
				top: -11px;
				left: 50%;
				transform: translateX(-50%);
			}
			.edge-right {
				right: -11px;
				top: 50%;
				transform: translateY(-50%);
			}
			.edge-bot {
				bottom: -11px;
				left: 50%;
				transform: translateX(-50%);
			}
			.edge-left {
				left: -11px;
				top: 50%;
				transform: translateY(-50%);
			}
			.meta {
				margin-top: 14px;
				font-size: 0.8rem;
				font-weight: 700;
				text-align: center;
			}
			@media print {
				.toolbar,
				.status-pill {
					display: none;
				}
				body {
					background: #fff;
					padding: 0;
				}
			}
		</style>
	</head>
	<body>
		<div class="toolbar">
			<button class="valid" onclick="setPreset('AA')">Set AA (irlo1 90° / irlo2 270°)</button>
			<button class="valid" onclick="setPreset('BB')">Set BB (irlo1 0° / irlo2 90°)</button>
			<button class="valid" onclick="setPreset('CC')">Set CC (irlo2 0° / irlo1 0°)</button>
			<button class="valid" onclick="setPreset('DD')">Set DD (irlo2 180° / irlo1 90°)</button>
			<button onclick="toggleSwap()" id="swapBtn">Swap Order (irlo1 | irlo2)</button>
			<button onclick="setPair(0, 0)">Reset Rotations (0° / 0°)</button>
			<label class="gap-ctrl">
				<span>Gap: <strong id="gapPct">6%</strong></span>
				<input id="gapSlider" type="range" min="0" max="30" value="6" oninput="updateGap(this.value)" />
			</label>
		</div>

		<div id="pairStatus" class="status-pill bad">
			Facing: B ↔ C · Incompatible (Individual models)
		</div>

		<div id="pairStage" class="pair-stage">
			<div class="canvas-card" id="cardContainer1">
				<div class="frame-wrap">
					<div class="edge-lbl edge-top" id="lbl1Top">A</div>
					<div class="edge-lbl edge-right" id="lbl1Right">B</div>
					<div class="edge-lbl edge-bot" id="lbl1Bot">D</div>
					<div class="edge-lbl edge-left" id="lbl1Left">C</div>
					<div id="canvas1" class="fiducial-frame" onclick="rotateCard(1)">
						<img src="/demo/irlo1.jpg" alt="irlo1" />
					</div>
				</div>
				<div class="meta">irlo1 (<span id="rot1Val">0°</span> · tap to rotate)</div>
			</div>

			<div class="canvas-card" id="cardContainer2">
				<div class="frame-wrap">
					<div class="edge-lbl edge-top" id="lbl2Top">A</div>
					<div class="edge-lbl edge-right" id="lbl2Right">C</div>
					<div class="edge-lbl edge-bot" id="lbl2Bot">B</div>
					<div class="edge-lbl edge-left" id="lbl2Left">D</div>
					<div id="canvas2" class="fiducial-frame" onclick="rotateCard(2)">
						<img src="/demo/irlo2.jpg" alt="irlo2" />
					</div>
				</div>
				<div class="meta">irlo2 (<span id="rot2Val">0°</span> · tap to rotate)</div>
			</div>
		</div>

		<script>
			const rot = { 1: 0, 2: 0 };
			const ring1 = ['A', 'B', 'D', 'C'];
			const ring2 = ['A', 'C', 'B', 'D'];
			let gapRatioPct = 6;
			let isSwapped = false; // false = irlo1 left, true = irlo2 left

			function applyCard(id) {
				document.getElementById('canvas' + id).style.transform = `rotate(${rot[id]}deg)`;
				document.getElementById('rot' + id + 'Val').textContent = rot[id] + '°';
				const step = rot[id] / 90;
				const ring = id === 1 ? ring1 : ring2;
				document.getElementById('lbl' + id + 'Top').textContent = ring[(0 - step + 4) % 4];
				document.getElementById('lbl' + id + 'Right').textContent = ring[(1 - step + 4) % 4];
				document.getElementById('lbl' + id + 'Bot').textContent = ring[(2 - step + 4) % 4];
				document.getElementById('lbl' + id + 'Left').textContent = ring[(3 - step + 4) % 4];
			}

			function updateStatus() {
				const leftId = isSwapped ? 2 : 1;
				const rightId = isSwapped ? 1 : 2;
				const edgeLeft = document.getElementById('lbl' + leftId + 'Right').textContent;
				const edgeRight = document.getElementById('lbl' + rightId + 'Left').textContent;
				const el = document.getElementById('pairStatus');
				const withinGap = gapRatioPct <= 20;
				const ok = edgeLeft === edgeRight && withinGap;
				el.className = 'status-pill ' + (ok ? 'ok' : 'bad');
				if (!withinGap) {
					el.textContent = `Facing: ${edgeLeft} ↔ ${edgeRight} · Gap ${gapRatioPct}% > 20% (Individual models)`;
				} else if (edgeLeft === edgeRight) {
					el.textContent = `Facing: ${edgeLeft} ↔ ${edgeRight} · COMPATIBLE → seam-${edgeLeft}${edgeRight}`;
				} else {
					el.textContent = `Facing: ${edgeLeft} ↔ ${edgeRight} · Incompatible (Individual models)`;
				}
			}

			function toggleSwap() {
				isSwapped = !isSwapped;
				const stage = document.getElementById('pairStage');
				const c1 = document.getElementById('cardContainer1');
				const c2 = document.getElementById('cardContainer2');
				if (isSwapped) {
					stage.insertBefore(c2, c1);
					document.getElementById('swapBtn').textContent = 'Swap Order (irlo2 | irlo1)';
				} else {
					stage.insertBefore(c1, c2);
					document.getElementById('swapBtn').textContent = 'Swap Order (irlo1 | irlo2)';
				}
				updateStatus();
			}

			function rotateCard(id) {
				rot[id] = (rot[id] + 90) % 360;
				applyCard(id);
				updateStatus();
			}

			function setPair(deg1, deg2) {
				rot[1] = deg1;
				rot[2] = deg2;
				applyCard(1);
				applyCard(2);
				updateStatus();
			}

			function setPreset(kind) {
				if (kind === 'AA') {
					if (isSwapped) toggleSwap();
					setPair(90, 270);
				} else if (kind === 'BB') {
					if (isSwapped) toggleSwap();
					setPair(0, 90);
				} else if (kind === 'CC') {
					if (!isSwapped) toggleSwap(); // irlo2 left (0°), irlo1 right (0°)
					setPair(0, 0);
				} else if (kind === 'DD') {
					if (!isSwapped) toggleSwap(); // irlo2 left (180°), irlo1 right (90°)
					setPair(90, 180);
				}
			}

			function updateGap(pct) {
				gapRatioPct = Number(pct);
				document.getElementById('gapPct').textContent = gapRatioPct + '%';
				const stage = document.getElementById('pairStage');
				const cardW = document.querySelector('.frame-wrap')?.getBoundingClientRect().width || 310;
				stage.style.gap = Math.round((cardW * gapRatioPct) / 100) + 'px';
				updateStatus();
			}

			updateGap(gapRatioPct);
			updateStatus();
		</script>
	</body>
</html>
