<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="solarCore" cx="55%" cy="48%" r="68%">
      <stop offset="0%" stop-color="#fff4c2" />
      <stop offset="28%" stop-color="#f59e0b" />
      <stop offset="65%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </radialGradient>
    <linearGradient id="edgeGlowA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Canvas background -->
  <rect width="800" height="800" fill="url(#solarCore)" />

  <!-- High-detail geometric arcs for high AR feature trackability -->
  <g stroke="#fef3c7" stroke-opacity="0.32" fill="none" stroke-width="3">
    <circle cx="440" cy="400" r="90" />
    <circle cx="440" cy="400" r="160" stroke-dasharray="18 10" />
    <circle cx="440" cy="400" r="230" />
    <circle cx="440" cy="400" r="300" stroke-dasharray="36 14 8 14" />
    <circle cx="440" cy="400" r="370" />
    <path d="M 0 180 Q 420 260 800 180" stroke="#34d399" stroke-width="6" stroke-opacity="0.7" />
    <path d="M 0 400 Q 440 310 800 400" stroke="#fbbf24" stroke-width="8" stroke-opacity="0.9" />
    <path d="M 0 620 Q 420 540 800 620" stroke="#c084fc" stroke-width="6" stroke-opacity="0.7" />
    <path d="M 180 0 Q 260 420 180 800" stroke="#60a5fa" stroke-width="6" stroke-opacity="0.7" />
    <path d="M 400 0 Q 320 400 400 800" stroke="#fde68a" stroke-width="5" stroke-opacity="0.65" />
    <path d="M 620 0 Q 540 420 620 800" stroke="#f97316" stroke-width="6" stroke-opacity="0.8" />
  </g>

  <!-- Asymmetric quadrant constellations (feature keypoints for rotation detection) -->
  <!-- Top-Left (North-West) -->
  <g fill="#34d399" opacity="0.92">
    <polygon points="110,70 145,130 75,130" />
    <circle cx="195" cy="105" r="16" />
    <rect x="85" y="155" width="34" height="34" transform="rotate(25 102 172)" />
  </g>
  <!-- Top-Right (North-East) -->
  <g fill="#fbbf24" opacity="0.95">
    <polygon points="690,75 730,115 690,155 650,115" />
    <circle cx="615" cy="95" r="14" />
    <circle cx="715" cy="185" r="20" />
  </g>
  <!-- Bottom-Left (South-West) -->
  <g fill="#60a5fa" opacity="0.92">
    <rect x="80" y="655" width="58" height="58" rx="10" />
    <circle cx="185" cy="705" r="18" />
  </g>
  <!-- Bottom-Right (South-East) -->
  <g fill="#e879f9" opacity="0.92">
    <polygon points="695,645 735,720 655,720" />
    <polygon points="615,675 645,725 585,725" />
  </g>

  <!-- Central Solar Motif -->
  <g transform="translate(440, 400)">
    <polygon points="0,-115 32,-32 115,0 32,32 0,115 -32,32 -115,0 -32,-32" fill="#fef08a" fill-opacity="0.88" />
    <circle cx="0" cy="0" r="42" fill="#7c2d12" stroke="#fde047" stroke-width="5" />
    <circle cx="0" cy="0" r="16" fill="#fef9c3" />
  </g>

  <!-- Seam-bridging semi-motifs on all 4 edges (A=Top, B=Right, C=Left, D=Bottom) -->
  <!-- Edge A (Top) -->
  <path d="M 280 0 C 340 85, 460 85, 520 0 Z" fill="#10b981" fill-opacity="0.78" />
  <!-- Edge B (Right) -->
  <path d="M 800 280 C 715 340, 715 460, 800 520 Z" fill="#f59e0b" fill-opacity="0.85" />
  <!-- Edge C (Left) -->
  <path d="M 0 280 C 85 340, 85 460, 0 520 Z" fill="#3b82f6" fill-opacity="0.8" />
  <!-- Edge D (Bottom) -->
  <path d="M 280 800 C 340 715, 460 715, 520 800 Z" fill="#a855f7" fill-opacity="0.8" />

  <!-- Subtle gallery frame & edge letter markers -->
  <rect x="12" y="12" width="776" height="776" fill="none" stroke="url(#edgeGlowA)" stroke-width="8" />
  <g font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff" text-anchor="middle">
    <!-- Top: A -->
    <rect x="372" y="16" width="56" height="38" rx="10" fill="#064e3b" fill-opacity="0.85" stroke="#34d399" stroke-width="2" />
    <text x="400" y="45">A</text>
    <!-- Right: B -->
    <rect x="746" y="381" width="38" height="56" rx="10" fill="#78350f" fill-opacity="0.85" stroke="#fbbf24" stroke-width="2" />
    <text x="765" y="419">B</text>
    <!-- Left: C -->
    <rect x="16" y="381" width="38" height="56" rx="10" fill="#1e3a8a" fill-opacity="0.85" stroke="#60a5fa" stroke-width="2" />
    <text x="35" y="419">C</text>
    <!-- Bottom: D -->
    <rect x="372" y="746" width="56" height="38" rx="10" fill="#581c87" fill-opacity="0.85" stroke="#c084fc" stroke-width="2" />
    <text x="400" y="775">D</text>
  </g>
</svg>
