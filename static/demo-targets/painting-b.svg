<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="lunarCore" cx="45%" cy="52%" r="68%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="30%" stop-color="#0284c7" />
      <stop offset="68%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="edgeGlowB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Canvas background -->
  <rect width="800" height="800" fill="url(#lunarCore)" />

  <!-- High-detail geometric harmonic rings for AR feature trackability -->
  <g stroke="#bae6fd" stroke-opacity="0.34" fill="none" stroke-width="3">
    <circle cx="360" cy="400" r="85" />
    <circle cx="360" cy="400" r="155" stroke-dasharray="14 12" />
    <circle cx="360" cy="400" r="225" />
    <circle cx="360" cy="400" r="295" stroke-dasharray="28 10 6 10" />
    <circle cx="360" cy="400" r="365" />
    <path d="M 0 180 Q 380 260 800 180" stroke="#34d399" stroke-width="6" stroke-opacity="0.75" />
    <path d="M 0 400 Q 360 490 800 400" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.9" />
    <path d="M 0 620 Q 380 540 800 620" stroke="#c084fc" stroke-width="6" stroke-opacity="0.75" />
    <path d="M 180 0 Q 260 380 180 800" stroke="#fbbf24" stroke-width="6" stroke-opacity="0.75" />
    <path d="M 400 0 Q 480 400 400 800" stroke="#7dd3fc" stroke-width="5" stroke-opacity="0.65" />
    <path d="M 620 0 Q 540 380 620 800" stroke="#60a5fa" stroke-width="6" stroke-opacity="0.8" />
  </g>

  <!-- Asymmetric quadrant constellations (feature keypoints for rotation detection) -->
  <!-- Top-Left (North-West) -->
  <g fill="#34d399" opacity="0.92">
    <circle cx="115" cy="115" r="30" />
    <polygon points="185,75 215,125 155,125" />
  </g>
  <!-- Top-Right (North-East) -->
  <g fill="#fbbf24" opacity="0.95">
    <rect x="655" y="75" width="54" height="54" rx="8" transform="rotate(15 682 102)" />
    <circle cx="605" cy="120" r="16" />
  </g>
  <!-- Bottom-Left (South-West) -->
  <g fill="#60a5fa" opacity="0.92">
    <polygon points="110,645 150,685 110,725 70,685" />
    <circle cx="190" cy="695" r="15" />
  </g>
  <!-- Bottom-Right (South-East) -->
  <g fill="#c084fc" opacity="0.92">
    <circle cx="690" cy="690" r="28" />
    <rect x="595" y="665" width="42" height="42" />
  </g>

  <!-- Central Astral Crescent & Compass Motif -->
  <g transform="translate(360, 400)">
    <polygon points="0,-110 28,-28 110,0 28,28 0,110 -28,28 -110,0 -28,-28" fill="#7dd3fc" fill-opacity="0.85" />
    <circle cx="0" cy="0" r="46" fill="#0c4a6e" stroke="#38bdf8" stroke-width="5" />
    <path d="M -12,-24 A 26,26 0 1,0 24,12 A 20,20 0 1,1 -12,-24 Z" fill="#e0f2fe" />
  </g>

  <!-- Seam-bridging semi-motifs on all 4 edges (A=Top, B=Right, C=Left, D=Bottom) -->
  <!-- Edge A (Top) -->
  <path d="M 280 0 C 340 85, 460 85, 520 0 Z" fill="#10b981" fill-opacity="0.78" />
  <!-- Edge B (Right) -->
  <path d="M 800 280 C 715 340, 715 460, 800 520 Z" fill="#f59e0b" fill-opacity="0.85" />
  <!-- Edge C (Left) -->
  <path d="M 0 280 C 85 340, 85 460, 0 520 Z" fill="#3b82f6" fill-opacity="0.8" />
  <!-- Edge D (Bottom) -->
  <path d="M 280 800 C 340 715, 460 715, 520 800 Z" fill="#a855f7" fill-opacity="0.8" />

  <!-- Subtle gallery frame & edge letter markers -->
  <rect x="12" y="12" width="776" height="776" fill="none" stroke="url(#edgeGlowB)" stroke-width="8" />
  <g font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff" text-anchor="middle">
    <!-- Top: A -->
    <rect x="372" y="16" width="56" height="38" rx="10" fill="#064e3b" fill-opacity="0.85" stroke="#34d399" stroke-width="2" />
    <text x="400" y="45">A</text>
    <!-- Right: B -->
    <rect x="746" y="381" width="38" height="56" rx="10" fill="#78350f" fill-opacity="0.85" stroke="#fbbf24" stroke-width="2" />
    <text x="765" y="419">B</text>
    <!-- Left: C -->
    <rect x="16" y="381" width="38" height="56" rx="10" fill="#1e3a8a" fill-opacity="0.85" stroke="#60a5fa" stroke-width="2" />
    <text x="35" y="419">C</text>
    <!-- Bottom: D -->
    <rect x="372" y="746" width="56" height="38" rx="10" fill="#581c87" fill-opacity="0.85" stroke="#c084fc" stroke-width="2" />
    <text x="400" y="775">D</text>
  </g>
</svg>
